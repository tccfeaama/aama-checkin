<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AAMA 管理後台 V5.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background: #f8f9fa; font-size: 14px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #login-page { flex: 1; display: flex; justify-content: center; align-items: center; }
        #admin-content { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .top-bar { background: white; border-bottom: 1px solid #ddd; padding: 15px 20px; }
        .main-container { flex: 1; display: flex; overflow: hidden; }
        .list-section { width: 66.6%; overflow-y: auto; padding: 20px; }
        .chat-section { width: 33.3%; border-left: 1px solid #ddd; background: white; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; background: #f1f3f5; }
        
        /* 身分別顏色 */
        .badge-mentor { background-color: #FF9E3E; color: white; }
        .badge-member { background-color: #0E7EE2; color: white; }
        .badge-partner { background-color: #7FD221; color: white; }
        .badge-guest { background-color: #E5E5E5; color: #333; }
        
        .vip-row { background-color: #fff5f5 !important; border-left: 4px solid #ff4d4f; }
        .sticky-head { position: sticky; top: 0; z-index: 10; background: #212529; color: white; }
    </style>
</head>
<body>

<div id="login-page">
    <div class="card p-4 shadow-lg" style="width: 360px; border-radius: 15px;">
        <h4 class="text-center mb-4 fw-bold">AAMA 管理員登入</h4>
        <input type="text" id="admin-user" class="form-control mb-3" placeholder="帳號">
        <input type="password" id="admin-pass" class="form-control mb-3" placeholder="密碼">
        <button class="btn btn-dark w-100 py-2" onclick="checkLogin()">登入系統</button>
    </div>
</div>

<div id="admin-content">
    <div class="top-bar">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <input type="file" id="import-file" style="display:none" onchange="importExcel(this)">
                <button class="btn btn-sm btn-primary me-2" onclick="document.getElementById('import-file').click()">匯入名單</button>
                <button class="btn btn-sm btn-success me-2" onclick="exportExcel()">下載結果</button>
                <button class="btn btn-sm btn-warning me-2" data-bs-toggle="modal" data-bs-target="#manualAddModal">半自動手動報到</button>
                <button class="btn btn-sm btn-danger" onclick="clearAllWithTripleConfirm()">清空資料庫</button>
            </div>
            <div class="fs-5">
                已到人數: <span id="s-in" class="text-primary fw-bold">0</span> | VIP 到場: <span id="s-vip" class="text-danger fw-bold">0</span>
            </div>
        </div>
        <div class="row g-2 align-items-center">
            <div class="col-md-5 d-flex gap-2">
                <button class="btn btn-sm btn-outline-secondary text-nowrap" onclick="document.getElementById('banner-upload').click()">上傳 Banner</button>
                <input type="file" id="banner-upload" style="display:none" accept="image/*" onchange="uploadImage(this)">
            </div>
            <div class="col-md-3">
                <select id="role-filter" class="form-select form-select-sm" onchange="renderList()">
                    <option value="">身分過濾: 全部</option>
                    <option value="學員">學員</option>
                    <option value="導師">導師</option>
                    <option value="共創/社群夥伴">共創/社群夥伴</option>
                    <option value="攜伴">攜伴</option>
                </select>
            </div>
            <div class="col-md-4">
                <input type="text" id="search" class="form-control form-control-sm" placeholder="搜尋姓名/公司/資料庫姓名..." oninput="renderList()">
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="list-section">
            <table class="table table-hover bg-white border">
                <thead class="sticky-head text-center">
                    <tr>
                        <th width="50">No.</th><th width="120">身分</th><th width="80">期數</th><th>填寫姓名</th><th>資料庫姓名</th><th>公司</th><th>備註</th>
                    </tr>
                </thead>
                <tbody id="p-list" class="text-center"></tbody>
            </table>
        </div>
        <div class="chat-section">
            <div class="p-2 border-bottom fw-bold bg-light">即時通訊</div>
            <div class="chat-messages" id="chat-msgs"></div>
            <div class="p-2 border-top">
                <div class="input-group">
                    <input type="text" id="msg-input" class="form-control" placeholder="輸入訊息...">
                    <button class="btn btn-primary" onclick="sendChat()">傳送</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="manualAddModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>半自動手動報到</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3">
                    <label>第一步：選擇身分</label>
                    <select id="m-role" class="form-select" onchange="updateManualOptions()">
                        <option value="">請選擇...</option>
                        <option>學員</option><option>導師</option><option>共創/社群夥伴</option><option>攜伴</option>
                    </select>
                </div>
                <div id="m-cohort-group" class="mb-3" style="display:none;">
                    <label>第二步：選擇期數</label>
                    <select id="m-cohort" class="form-select" onchange="updateManualOptions()">
                    </select>
                </div>
                <div class="mb-3">
                    <label>最後：選擇人名 (支援輸入首字搜尋)</label>
                    <input list="name-datalist" id="m-name-input" class="form-control" placeholder="輸入名字關鍵字...">
                    <datalist id="name-datalist"></datalist>
                </div>
            </div>
            <div class="modal-footer"><button class="btn btn-primary w-100" onclick="submitManualAdd()">確認報到</button></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAOP0elxmO2sYfIzEVfWL-wFSbKG6XjFL4",
        authDomain: "aama-checkin-system.firebaseapp.com",
        databaseURL: "https://aama-checkin-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "aama-checkin-system",
        storageBucket: "aama-checkin-system.firebasestorage.app",
        messagingSenderId: "979394114808",
        appId: "1:979394114808:web:7be3eaaaf344f46526b70d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let allData = [];

    function checkLogin() {
        if(document.getElementById('admin-user').value === 'aamatccfe' && document.getElementById('admin-pass').value === 'aama77793991') {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('admin-content').style.display = 'flex';
            startListening();
        } else alert('驗證失敗');
    }

    function startListening() {
        db.ref('participants').on('value', (s) => {
            allData = [];
            s.forEach(c => { let d = c.val(); d.key = c.key; allData.push(d); });
            renderList();
        });
        db.ref('chats').limitToLast(50).on('value', (s) => {
            const box = document.getElementById('chat-msgs');
            let html = '';
            s.forEach(c => { const m = c.val(); html += `<div class="mb-2"><b>${m.user}:</b> ${m.msg} <br><small class="text-muted">${m.time}</small></div>`; });
            box.innerHTML = html; box.scrollTop = box.scrollHeight;
        });
    }

    function getRoleBadge(role) {
        const map = {
            '導師': 'badge-mentor',
            '學員': 'badge-member',
            '共創/社群夥伴': 'badge-partner',
            '攜伴': 'badge-guest'
        };
        return map[role] || 'bg-secondary';
    }

    function renderList() {
        const list = document.getElementById('p-list');
        const search = document.getElementById('search').value.toLowerCase();
        const roleFilter = document.getElementById('role-filter').value;
        
        let filtered = allData.filter(d => {
            const matchSearch = (d.inputName || "").toLowerCase().includes(search) || 
                              (d.name || "").toLowerCase().includes(search) || 
                              (d.company || "").toLowerCase().includes(search);
            const matchRole = !roleFilter || d.role === roleFilter;
            return d.checked && matchSearch && matchRole;
        }).sort((a, b) => b.checkTime - a.checkTime);

        list.innerHTML = filtered.map((d, i) => `
            <tr class="${d.isVIP === '是' ? 'vip-row' : ''}">
                <td>${filtered.length - i}</td>
                <td><span class="badge ${getRoleBadge(d.role)}">${d.role}</span></td>
                <td>${d.cohort || '-'}</td>
                <td>${d.inputName || '-'}</td>
                <td>${d.name || '-'}</td>
                <td>${d.company || '-'}</td>
                <td>${d.isVIP === '是' ? '<span class="text-danger fw-bold">★VIP</span> ' : ''}${d.note || ''}</td>
            </tr>
        `).join('');

        document.getElementById('s-in').innerText = allData.filter(d => d.checked).length;
        document.getElementById('s-vip').innerText = allData.filter(d => d.checked && d.isVIP === '是').length;
    }

    // 更新半自動選單選項
    function updateManualOptions() {
        const role = document.getElementById('m-role').value;
        const cohortGroup = document.getElementById('m-cohort-group');
        const cohortSelect = document.getElementById('m-cohort');
        const datalist = document.getElementById('name-datalist');
        
        datalist.innerHTML = "";
        
        if (role === '學員') {
            cohortGroup.style.display = 'block';
            // 抓取名單中所有的期數
            const cohorts = [...new Set(allData.filter(d => d.role === '學員').map(d => d.cohort))].sort();
            if (cohortSelect.innerHTML === "" || cohortSelect.getAttribute('data-role') !== '學員') {
                cohortSelect.innerHTML = '<option value="">請選擇期數...</option>' + cohorts.map(c => `<option value="${c}">${c}</option>`).join('');
                cohortSelect.setAttribute('data-role', '學員');
            }
        } else {
            cohortGroup.style.display = 'none';
        }

        const selectedCohort = cohortSelect.value;
        // 過濾出符合條件且尚未報到的人
        const filteredNames = allData.filter(d => {
            if (d.checked) return false;
            if (d.role !== role) return false;
            if (role === '學員' && selectedCohort && d.cohort !== selectedCohort) return false;
            return true;
        });

        datalist.innerHTML = filteredNames.map(d => `<option value="${d.name}">`).join('');
    }

    function submitManualAdd() {
        const role = document.getElementById('m-role').value;
        const nameInput = document.getElementById('m-name-input').value;
        const selectedCohort = document.getElementById('m-cohort').value;

        // 找尋資料庫中的該人
        const person = allData.find(d => d.name === nameInput && d.role === role && (role !== '學員' || d.cohort === selectedCohort));

        if (person) {
            let remark = person.isRegistered === "否" ? "未報名！" : "管理員手動新增";
            db.ref('participants/' + person.key).update({
                checked: true,
                inputName: person.name,
                note: remark,
                checkTime: Date.now()
            });
            alert("報到成功！");
        } else {
            alert("找不到該名單，請確認姓名與身分是否正確。");
        }
        
        bootstrap.Modal.getInstance(document.getElementById('manualAddModal')).hide();
    }

    function uploadImage(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => db.ref('config').update({ bannerUrl: e.target.result });
        reader.readAsDataURL(file);
    }

    function clearAllWithTripleConfirm() {
        if(confirm("確定清空？")) if(confirm("將永久刪除，無法還原。確定？")) if(confirm("最後警告：確定執行？")) { db.ref('participants').remove(); db.ref('chats').remove(); alert("已清空"); }
    }

    function exportExcel() {
        const data = allData.filter(d => d.checked).map(d => ({ "身分": d.role, "期數": d.cohort, "姓名": d.inputName, "公司": d.company, "備註": d.note, "時間": new Date(d.checkTime).toLocaleString() }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "報到名單");
        XLSX.writeFile(wb, `Results.xlsx`);
    }

    function importExcel(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const workbook = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]).forEach(r => {
                db.ref('participants').push({
                    name: r['姓名'] || r['name'] || "",
                    englishName: r['英文名'] || r['englishName'] || "",
                    role: r['身分別'] || r['role'] || "",
                    cohort: r['學員期數'] || r['cohort'] || "",
                    company: r['公司'] || r['company'] || "",
                    isRegistered: r['是否有報名活動'] || r['isRegistered'] || "是",
                    isVIP: r['是否為 VIP'] || r['isVIP'] || "否",
                    checked: false, 
                    note: r['備註'] || r['note'] || ""
                });
            });
            alert('匯入完成');
        };
        reader.readAsArrayBuffer(input.files[0]);
    }

    function sendChat() {
        const val = document.getElementById('msg-input').value;
        if(val) { db.ref('chats').push({ user: "報到台", msg: val, time: new Date().toLocaleTimeString() }); document.getElementById('msg-input').value = ""; }
    }
</script>
</body>
</html>
