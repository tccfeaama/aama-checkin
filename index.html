<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAMA 活動報到 V6.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: "Microsoft JhengHei", sans-serif; display: flex; align-items: flex-start; justify-content: center; min-height: 100vh; margin: 0; }
        .wrapper { width: 100%; max-width: 450px; margin-top: 20px; padding: 10px; }
        .banner-container { width: 100%; aspect-ratio: 16 / 9; background: #eee; border-radius: 15px 15px 0 0; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .banner-container img { width: 100%; height: 100%; object-fit: cover; }
        .container-box { background: white; padding: 30px; border-radius: 0 0 15px 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-primary { background-color: #0E7EE2; border: none; padding: 12px; border-radius: 10px; font-weight: bold; }
        .btn-warning { padding: 12px; border-radius: 10px; font-weight: bold; }
        #success-view { display: none; text-align: center; padding: 40px 0; }
        .checkmark { font-size: 80px; color: #28a745; }
        .required-label::after { content: " *"; color: red; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="banner-container">
        <img id="main-banner" src="" alt="活動主視覺" onerror="this.src='https://via.placeholder.com/1600x900?text=AAMA+Event'">
    </div>

    <div class="container-box">
        <form id="checkin-form" onsubmit="event.preventDefault(); handleCheckIn();">
            <div id="checkin-view">
                <div class="mb-3">
                    <label class="form-label required-label">身分別</label>
                    <select id="role" class="form-select" required onchange="toggleCohortField()">
                        <option value="" disabled selected>請選擇身分</option>
                        <option value="學員">學員</option>
                        <option value="導師">導師</option>
                        <option value="共創/社群夥伴">共創/社群夥伴</option>
                        <option value="攜伴">攜伴</option>
                    </select>
                </div>
                
                <div id="cohort-group" class="mb-3" style="display:none;">
                    <label class="form-label required-label">學員期數</label>
                    <input type="number" id="cohort" class="form-control" placeholder="輸入期數數字 (如: 14)">
                </div>

                <div class="mb-3">
                    <label class="form-label required-label">姓名</label>
                    <input type="text" id="name" class="form-control" placeholder="輸入姓名或英文名" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">送出報到</button>
            </div>
        </form>

        <form id="supplement-form" style="display:none;" onsubmit="event.preventDefault(); submitSupplement();">
            <div class="mb-4 text-center"><h5>未在名單內，請填寫補件資訊</h5></div>
            <div class="mb-3">
                <label class="form-label required-label">公司名稱</label>
                <input type="text" id="company" class="form-control" required placeholder="例如: 某某科技">
            </div>
            <button type="submit" class="btn btn-warning w-100">完成手動補件</button>
        </form>

        <div id="success-view">
            <div class="checkmark">✓</div>
            <h3>報到成功</h3>
            <p class="text-muted">祝您活動愉快！</p>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAOP0elxmO2sYfIzEVfWL-wFSbKG6XjFL4",
        authDomain: "aama-checkin-system.firebaseapp.com",
        databaseURL: "https://aama-checkin-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "aama-checkin-system",
        storageBucket: "aama-checkin-system.firebasestorage.app",
        messagingSenderId: "979394114808",
        appId: "1:979394114808:web:7be3eaaaf344f46526b70d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('config/bannerUrl').on('value', (s) => {
        if(s.val()) document.getElementById('main-banner').src = s.val();
    });

    function toggleCohortField() {
        const role = document.getElementById('role').value;
        const cohortGroup = document.getElementById('cohort-group');
        const cohortInput = document.getElementById('cohort');
        if (role === '學員') {
            cohortGroup.style.display = 'block';
            cohortInput.required = true;
        } else {
            cohortGroup.style.display = 'none';
            cohortInput.required = false;
        }
    }

    // 發送 VIP 通知函數 (全域複用)
    function notifyVIP(name) {
        db.ref('chats').push({
            user: "系統",
            msg: `📢 VIP [${name}] 已報到！`,
            time: new Date().toLocaleTimeString()
        });
    }

    function handleCheckIn() {
        const role = document.getElementById('role').value;
        const rawInput = document.getElementById('name').value.trim();
        const nameInput = rawInput.toLowerCase(); // 標準化小寫比對
        const cohortInput = document.getElementById('cohort').value.trim();

        if (role === '學員' && (parseInt(cohortInput) < 1 || !cohortInput)) {
            alert("請輸入有效的學員期數");
            return;
        }

        db.ref('participants').once('value', (snapshot) => {
            let matchedUser = null;
            let matchedKey = null;

            snapshot.forEach((child) => {
                const data = child.val();
                const dbName = (data.name || "").trim().toLowerCase();
                const dbEngName = (data.englishName || "").trim().toLowerCase();
                
                // 邏輯升級：分詞比對 (處理 王小明 Kevin 這種情況)
                // 只要資料庫中的名字「包含在」輸入中，或輸入中任何一段「等於」資料庫名字
                const nameMatch = nameInput.includes(dbName) || nameInput.includes(dbEngName) || 
                                  (dbName !== "" && dbName === nameInput) || 
                                  (dbEngName !== "" && dbEngName === nameInput);

                const roleMatch = data.role === role;
                let cohortMatch = true;
                if (role === '學員') {
                    cohortMatch = String(data.cohort) === String(cohortInput);
                }

                if (nameMatch && roleMatch && cohortMatch) {
                    matchedUser = data;
                    matchedKey = child.key;
                }
            });

            if (matchedUser) {
                if (matchedUser.checked) {
                    alert("您已完成報到，請勿重複送出");
                    return;
                }

                let remark = matchedUser.isRegistered === "否" ? "未報名！" : (matchedUser.note || "");

                db.ref('participants/' + matchedKey).update({
                    checked: true,
                    inputName: rawInput,
                    checkTime: Date.now(),
                    note: remark
                });

                if(matchedUser.isVIP === "是") notifyVIP(matchedUser.name || rawInput);
                showSuccess();
            } else {
                document.getElementById('checkin-form').style.display = 'none';
                document.getElementById('supplement-form').style.display = 'block';
            }
        });
    }

    function submitSupplement() {
        const rawName = document.getElementById('name').value.trim();
        const role = document.getElementById('role').value;
        db.ref('participants').push({
            name: rawName,
            inputName: rawName,
            role: role,
            company: document.getElementById('company').value,
            cohort: document.getElementById('cohort').value,
            checked: true,
            isVIP: "否",
            note: "手動補件",
            checkTime: Date.now()
        });
        showSuccess();
    }

    function showSuccess() {
        document.getElementById('checkin-form').style.display = 'none';
        document.getElementById('supplement-form').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
    }
</script>
</body>
</html>
