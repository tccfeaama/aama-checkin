<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AAMA 報到管理系統 V4.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background: #f8f9fa; font-size: 14px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #login-page { flex: 1; display: flex; justify-content: center; align-items: center; }
        #admin-content { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .top-bar { background: white; border-bottom: 1px solid #ddd; padding: 15px 20px; }
        .main-container { flex: 1; display: flex; overflow: hidden; }
        .list-section { width: 66.6%; overflow-y: auto; padding: 20px; }
        .chat-section { width: 33.3%; border-left: 1px solid #ddd; background: white; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; background: #f1f3f5; }
        .vip-row { background-color: #fff5f5 !important; border-left: 4px solid #ff4d4f; }
        .sticky-head { position: sticky; top: 0; z-index: 10; background: #212529; color: white; }
    </style>
</head>
<body>

<div id="login-page">
    <div class="card p-4 shadow-lg" style="width: 360px; border-radius: 15px;">
        <h4 class="text-center mb-4 fw-bold">AAMA 管理員登入</h4>
        <input type="text" id="admin-user" class="form-control mb-3" placeholder="帳號">
        <input type="password" id="admin-pass" class="form-control mb-3" placeholder="密碼">
        <button class="btn btn-dark w-100 py-2" onclick="checkLogin()">登入系統</button>
    </div>
</div>

<div id="admin-content">
    <div class="top-bar">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="btn-group">
                <input type="file" id="import-file" style="display:none" onchange="importExcel(this)">
                <button class="btn btn-sm btn-primary" onclick="document.getElementById('import-file').click()">匯入名單</button>
                <button class="btn btn-sm btn-success" onclick="exportExcel()">下載結果</button>
                <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#manualAddModal">手動新增</button>
                <button class="btn btn-sm btn-danger" onclick="clearAllWithTripleConfirm()">清空資料庫</button>
            </div>
            <div class="fs-5">
                已到人數: <span id="s-in" class="text-primary fw-bold">0</span> | VIP 到場: <span id="s-vip" class="text-danger fw-bold">0</span>
            </div>
        </div>
        <div class="row g-2 align-items-center">
            <div class="col-md-5 d-flex gap-2">
                <button class="btn btn-sm btn-outline-secondary text-nowrap" onclick="document.getElementById('banner-upload').click()">上傳 Banner</button>
                <input type="file" id="banner-upload" style="display:none" accept="image/*" onchange="uploadImage(this)">
                <input type="text" id="banner-input" class="form-control form-control-sm" placeholder="或輸入圖片網址..." onchange="updateBanner(this.value)">
            </div>
            <div class="col-md-3">
                <select id="role-filter" class="form-select form-select-sm" onchange="renderList()">
                    <option value="">身分過濾: 全部</option>
                    <option value="學員">學員</option>
                    <option value="導師">導師</option>
                    <option value="共創/社群夥伴">共創/社群夥伴</option>
                    <option value="攜伴">攜伴</option>
                </select>
            </div>
            <div class="col-md-4">
                <input type="text" id="search" class="form-control form-control-sm" placeholder="搜尋姓名/公司..." oninput="renderList()">
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="list-section">
            <table class="table table-hover bg-white border">
                <thead class="sticky-head text-center">
                    <tr>
                        <th width="50">No.</th><th width="100">身分</th><th width="80">期數</th><th>填寫姓名</th><th>資料庫姓名</th><th>公司</th><th>備註</th>
                    </tr>
                </thead>
                <tbody id="p-list" class="text-center"></tbody>
            </table>
        </div>
        <div class="chat-section">
            <div class="p-2 border-bottom fw-bold bg-light">即時通訊</div>
            <div class="chat-messages" id="chat-msgs"></div>
            <div class="p-2 border-top">
                <div class="input-group">
                    <input type="text" id="msg-input" class="form-control" placeholder="輸入訊息...">
                    <button class="btn btn-primary" onclick="sendChat()">傳送</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="manualAddModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">手動新增參與者</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3"><label>身分別</label><select id="m-role" class="form-select"><option>學員</option><option>導師</option><option>共創/社群夥伴</option><option>攜伴</option></select></div>
                <div class="mb-3"><label>姓名</label><input type="text" id="m-name" class="form-control"></div>
                <div class="mb-3"><label>公司</label><input type="text" id="m-company" class="form-control"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-primary w-100" onclick="submitManualAdd()">確認匯入並置頂</button></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAOP0elxmO2sYfIzEVfWL-wFSbKG6XjFL4",
        authDomain: "aama-checkin-system.firebaseapp.com",
        databaseURL: "https://aama-checkin-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "aama-checkin-system",
        storageBucket: "aama-checkin-system.firebasestorage.app",
        messagingSenderId: "979394114808",
        appId: "1:979394114808:web:7be3eaaaf344f46526b70d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let allData = [];

    function checkLogin() {
        const u = document.getElementById('admin-user').value;
        const p = document.getElementById('admin-pass').value;
        if(u === 'aamatccfe' && p === 'aama77793991') {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('admin-content').style.display = 'flex';
            startListening();
        } else { alert('登入認證失敗！'); }
    }

    function startListening() {
        db.ref('config/bannerUrl').on('value', s => document.getElementById('banner-input').value = s.val() || "");
        db.ref('participants').on('value', (s) => {
            allData = [];
            s.forEach(c => { let d = c.val(); d.key = c.key; allData.push(d); });
            renderList();
        });
        db.ref('chats').limitToLast(50).on('value', (s) => {
            const box = document.getElementById('chat-msgs');
            let html = '';
            s.forEach(c => { const m = c.val(); html += `<div class="mb-2"><b>${m.user}:</b> ${m.msg} <br><small class="text-muted">${m.time}</small></div>`; });
            box.innerHTML = html; box.scrollTop = box.scrollHeight;
        });
    }

    function renderList() {
        const list = document.getElementById('p-list');
        const search = document.getElementById('search').value.toLowerCase();
        const roleFilter = document.getElementById('role-filter').value;
        
        let filtered = allData.filter(d => {
            const matchSearch = (d.inputName || d.name || d.company || "").toLowerCase().includes(search);
            const matchRole = !roleFilter || d.role === roleFilter;
            return d.checked && matchSearch && matchRole;
        }).sort((a, b) => b.checkTime - a.checkTime);

        list.innerHTML = filtered.map((d, i) => `
            <tr class="${d.isVIP === '是' ? 'vip-row' : ''}">
                <td>${filtered.length - i}</td>
                <td><span class="badge bg-secondary">${d.role}</span></td>
                <td>${d.cohort || '-'}</td>
                <td>${d.inputName || '-'}</td>
                <td>${d.name || '-'}</td>
                <td>${d.company || '-'}</td>
                <td>${d.isVIP === '是' ? '<span class="text-danger fw-bold">★VIP</span> ' : ''}${d.note || ''}</td>
            </tr>
        `).join('');

        document.getElementById('s-in').innerText = allData.filter(d => d.checked).length;
        document.getElementById('s-vip').innerText = allData.filter(d => d.checked && d.isVIP === '是').length;
    }

    function uploadImage(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => updateBanner(e.target.result);
        reader.readAsDataURL(file);
    }

    function updateBanner(val) { db.ref('config').update({ bannerUrl: val }); }

    function submitManualAdd() {
        db.ref('participants').push({
            role: document.getElementById('m-role').value,
            name: "", inputName: document.getElementById('m-name').value,
            company: document.getElementById('m-company').value,
            checked: true, isVIP: "否", note: "管理員手動新增", checkTime: Date.now()
        });
        bootstrap.Modal.getInstance(document.getElementById('manualAddModal')).hide();
        document.getElementById('m-name').value = ""; document.getElementById('m-company').value = "";
    }

    function clearAllWithTripleConfirm() {
        if(confirm("【第一層確認】確定要清空資料庫嗎？")) {
            if(confirm("【第二層確認】所有報到紀錄將永久刪除，無法還原！您真的確定嗎？")) {
                if(confirm("【第三層確認】最後一次警告。請確認是否要執行刪除動作？")) {
                    db.ref('participants').remove();
                    db.ref('chats').remove();
                    alert("資料庫已完全清空。");
                }
            }
        }
    }

    function exportExcel() {
        const data = allData.filter(d => d.checked).map(d => ({
            "身分": d.role, "期數": d.cohort, "姓名": d.inputName, 
            "資料庫對應姓名": d.name, "公司": d.company, "備註": d.note, "時間": new Date(d.checkTime).toLocaleString()
        }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "報到名單");
        XLSX.writeFile(wb, `AAMA_Results_${new Date().toLocaleDateString()}.xlsx`);
    }

    function importExcel(input) {
        const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const firstSheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);

            console.log("Excel 原始讀取結果：", jsonData); // 關鍵：看控制台輸出了什麼

            if (jsonData.length === 0) {
                alert("檔案內似乎沒有資料！");
                return;
            }

            let successCount = 0;
            jsonData.forEach((row, index) => {
                // 檢查欄位是否存在
                const name = row['姓名'] || row['name'];
                const role = row['身分別'] || row['role'];

                if (!name || !role) {
                    console.warn(`第 ${index + 2} 列資料缺少姓名或身分別，跳過該筆。`, row);
                    return;
                }

                db.ref('participants').push({
                    name: name || "",
                    englishName: row['英文名'] || row['englishName'] || "",
                    role: role || "",
                    cohort: row['學員期數'] || row['cohort'] || "",
                    company: row['公司'] || row['company'] || "",
                    isVIP: row['是否為 VIP'] || row['isVIP'] || "否",
                    checked: false, 
                    note: row['備註'] || row['note'] || "",
                    checkTime: 0
                });
                successCount++;
            });

            alert(`名單匯入處理完成！共成功匯入 ${successCount} 筆資料。`);
        } catch (error) {
            console.error("匯入發生錯誤：", error);
            alert("讀取檔案失敗，請確保是正確的 Excel (.xlsx) 檔案。");
        }
    };
    reader.readAsArrayBuffer(file);
    }

    function sendChat() {
        const val = document.getElementById('msg-input').value;
        if(!val) return;
        db.ref('chats').push({ user: "報到台", msg: val, time: new Date().toLocaleTimeString() });
        document.getElementById('msg-input').value = "";
    }
</script>
</body>
</html>
